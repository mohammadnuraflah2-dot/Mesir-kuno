name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: AncientEgyptStory
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang library Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Install dependency
        run: npm install

      - name: Cek proyek
        run: npm run check

      - name: Render
        run: npx remotion render AncientEgyptStory out/video.mp4 --concurrency=3

      - name: Simpan video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: AncientEgyptStory/out/video.mp4
          retention-days: 7
